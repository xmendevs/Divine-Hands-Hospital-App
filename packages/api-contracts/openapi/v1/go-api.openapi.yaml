        id: { type: string, format: uuid }
        patientNo: { type: string }
        registrationType: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        gender: { type: string }
        dateOfBirth: { type: string }
        phone: { type: string }
    ClinicalEntry:
      type: object
