components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Correlation ID echoed back on the response and in logs.
      schema:
        type: string
    Id:
      name: id
      in: path
      required: true
      description: Resource internal UUID.
      schema:
        type: string
        format: uuid
    PageLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of records to return.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    PageOffset:
      name: offset
      in: query
      required: false
      description: Number of records to skip.
      schema:
        type: integer
        minimum: 0
        default: 0
    LabTestId:
      name: id
      in: path
      required: true
      description: Catalogue test internal UUID.
      schema:
        type: string
        format: uuid
    LabClientId:
      name: id
      in: path
      required: true
      description: Lab client internal UUID.
      schema:
        type: string
        format: uuid
    LabRequestId:
      name: id
      in: path
      required: true
      description: Lab request internal UUID.
      schema:
        type: string
        format: uuid
    LabSpecimenId:
      name: id
      in: path
      required: true
      description: Specimen internal UUID.
      schema:
        type: string
        format: uuid
    LabItemId:
      name: id
      in: path
      required: true
      description: Request item internal UUID.
      schema:
        type: string
        format: uuid
    LabNotificationId:
      name: id
      in: path
      required: true
      description: Critical notification internal UUID.
      schema:
        type: string
        format: uuid
    PriceListId:
      name: id
      in: path
      required: true
      description: Price list internal UUID.
      schema:
        type: string
        format: uuid
    PriceListItemId:
      name: id
      in: path
      required: true
      description: Price list item internal UUID.
      schema:
        type: string
        format: uuid
    InvoiceId:
      name: id
      in: path
      required: true
      description: Invoice internal UUID.
      schema:
        type: string
        format: uuid
    PaymentId:
      name: id
      in: path
      required: true
      description: Payment internal UUID.
      schema:
        type: string
        format: uuid
    ReceiptId:
      name: id
      in: path
      required: true
      description: Receipt internal UUID.
      schema:
        type: string
        format: uuid
    RefundRequestId:
      name: id
      in: path
      required: true
      description: Refund request internal UUID.
      schema:
        type: string
        format: uuid
    ShiftId:
      name: id
      in: path
      required: true
      description: Cashier shift internal UUID.
      schema:
        type: string
        format: uuid
    StaffId:
      name: id
      in: path
      required: true
      description: Staff member internal UUID.
      schema:
        type: string
        format: uuid
    StaffShiftId:
      name: id
      in: path
      required: true
      description: Staff shift definition internal UUID.
      schema:
        type: string
        format: uuid
    LeaveId:
      name: id
      in: path
      required: true
      description: Leave request internal UUID.
      schema:
        type: string
        format: uuid
    AttendanceId:
      name: id
      in: path
      required: true
      description: Attendance record internal UUID.
      schema:
        type: string
        format: uuid
    HandoverId:
      name: id
      in: path
      required: true
      description: Handover note internal UUID.
      schema:
        type: string
        format: uuid
    RosterId:
      name: id
      in: path
      required: true
      description: Staff roster assignment internal UUID.
      schema:
        type: string
        format: uuid
  schemas:
    HealthResponse:
      type: object
      required: [status, service, time]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
        time:
          type: string
          format: date-time
    CheckResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, error]
        error:
          type: string
    ReadyResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/CheckResult"
    VersionResponse:
      type: object
      required: [service, version, timezone, utcNow]
      properties:
        service:
          type: string
        version:
          type: string
        timezone:
          type: string
        utcNow:
          type: string
          format: date-time
    User:
      type: object
      required: [id, username, email, status]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        status:
          type: string
          enum: [pending, active, suspended]
    Role:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
        totpCode:
          type: string
        deviceName:
          type: string
    LoginResponse:
      type: object
      required: [token, expiresAt, mustChangePassword, user]
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
        mustChangePassword:
          type: boolean
        user:
          $ref: "#/components/schemas/User"
    MeResponse:
      type: object
      required: [id, username, email, status, mustChangePassword, mfaEnabled, roles, permissions]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        status:
          type: string
        mustChangePassword:
          type: boolean
        mfaEnabled:
          type: boolean
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        permissions:
          type: array
          items:
            type: string
    RegisterPatientRequest:
      type: object
      required: [firstName, lastName]
      properties:
        registrationType:
          type: string
          enum: [normal, antenatal, emergency]
        familyId:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        middleName:
          type: string
        gender:
          type: string
        dateOfBirth:
          type: string
          format: date
        bloodGroup:
          type: string
        genotype:
          type: string
        maritalStatus:
          type: string
        occupation:
          type: string
        phone:
          type: string
        alternatePhone:
          type: string
        email:
          type: string
        addressLine1:
          type: string
        addressLine2:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        country:
          type: string
        identificationType:
          type: string
        identificationNumber:
          type: string
        nextOfKinName:
          type: string
        nextOfKinRelationship:
          type: string
        nextOfKinPhone:
          type: string
        consentGiven:
          type: boolean
        privacyNotes:
          type: string
        force:
          type: boolean
          description: Bypass the soft duplicate check (the database still enforces uniqueness).
    UpdatePatientRequest:
      type: object
      properties:
        firstName: { type: string }
        lastName: { type: string }
        middleName: { type: string }
        gender: { type: string }
        dateOfBirth: { type: string, format: date }
        bloodGroup: { type: string }
        genotype: { type: string }
        maritalStatus: { type: string }
        occupation: { type: string }
        phone: { type: string }
        alternatePhone: { type: string }
        email: { type: string }
        addressLine1: { type: string }
        addressLine2: { type: string }
