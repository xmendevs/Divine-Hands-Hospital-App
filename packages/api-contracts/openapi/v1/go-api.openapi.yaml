openapi: 3.1.0
info:
  title: HIMS go-api
  version: 0.1.0
  description: Core service API for the Divine Hands HMS.
servers:
  - url: http://localhost:8080
tags:
  - name: system
    description: Health, readiness, and metadata endpoints.
paths:
  /health:
    get:
      operationId: health
      summary: Liveness probe
      tags: [system]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      operationId: readiness
      summary: Readiness probe
      tags: [system]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
  /api/v1/version:
    get:
      operationId: version
      summary: Service metadata
      tags: [system]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Service metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
components:
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Correlation ID echoed back on the response and in logs.
      schema:
        type: string
  schemas:
    HealthResponse:
      type: object
      required: [status, service, time]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
        time:
          type: string
          format: date-time
    CheckResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, error]
        error:
          type: string
    ReadyResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/CheckResult"
    VersionResponse:
      type: object
      required: [service, version, timezone, utcNow]
      properties:
        service:
          type: string
        version:
          type: string
        timezone:
          type: string
        utcNow:
          type: string
          format: date-time
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
