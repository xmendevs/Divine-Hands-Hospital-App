    Report:
      type: object
      required: [id, title, content, authorId, createdAt]
      properties:
        id: { type: string, format: uuid }
        reportType: { type: string }
        title: { type: string }
        content: { type: string }
        authorId: { type: string, format: uuid }
        departmentId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
    QueueItem:
      type: object
      required: [assignmentId, patientId, patientNo, firstName, lastName, assignedAt]
      properties:
        assignmentId: { type: string, format: uuid }
        patientId: { type: string, format: uuid }
        patientNo: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        gender: { type: string }
        dateOfBirth: { type: string }
        phone: { type: string }
        assignedAt: { type: string, format: date-time }
    TriageResponse:
      type: object
      required: [patient, triage]
      properties:
        patient: { $ref: "#/components/schemas/Patient" }
        triage:
          type: object
          required: [id, patientId, triageLevel, chiefComplaint, createdAt]
          properties:
            id: { type: string, format: uuid }
            patientId: { type: string, format: uuid }
            triageLevel: { type: string }
            chiefComplaint: { type: string }
            measurements:
              type: object
              additionalProperties: true
            createdAt: { type: string, format: date-time }
    Medicine:
      type: object
      required: [id, code, genericName, active]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        genericName: { type: string }
        brand: { type: string }
        strength: { type: string }
        dosageForm: { type: string }
        category: { type: string }
        supplier: { type: string }
        reorderLevel: { type: number }
        storageLocation: { type: string }
        unitCost: { type: number }
        sellingPrice: { type: number }
        active: { type: boolean }
    Batch:
      type: object
      required: [id, medicineId, batchNumber, quantityOnHand, status]
      properties:
        id: { type: string, format: uuid }
        medicineId: { type: string, format: uuid }
        batchNumber: { type: string }
        manufacturingDate: { type: string, format: date, nullable: true }
        expiryDate: { type: string, format: date, nullable: true }
        quantityOnHand: { type: number }
        purchaseCost: { type: number }
        sellingPrice: { type: number }
        supplier: { type: string }
        status: { type: string, enum: [active, quarantined] }
        receivedAt: { type: string, format: date-time }
    Movement:
      type: object
      required:
        [
          id,
          medicineId,
          movementType,
          quantity,
          quantityBefore,
          quantityAfter,
          performedBy,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        medicineId: { type: string, format: uuid }
        batchId: { type: string, format: uuid, nullable: true }
        movementType: { type: string }
        quantity: { type: number }
        quantityBefore: { type: number }
        quantityAfter: { type: number }
        reason: { type: string }
        referenceType: { type: string }
        performedBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    Adjustment:
      type: object
      required: [id, medicineId, batchId, quantity, reason, status, requestedBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        medicineId: { type: string, format: uuid }
        batchId: { type: string, format: uuid }
        quantity: { type: number }
        reason: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        approvalRequestId: { type: string, format: uuid, nullable: true }
        requestedBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    Approval:
      type: object
      required: [id, subjectType, subjectId, requestedBy, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        subjectType: { type: string }
        subjectId: { type: string, format: uuid }
        action: { type: string }
        requestedBy: { type: string, format: uuid }
        status: { type: string, enum: [pending, approved, rejected] }
        details:
          type: object
          additionalProperties: true
        reason: { type: string }
        decidedBy: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
    Dispensation:
      type: object
      required:
        [id, dispensationNo, prescriptionOrderId, patientId, dispensedBy, totalAmount, createdAt]
      properties:
        id: { type: string, format: uuid }
        dispensationNo: { type: string }
        prescriptionOrderId: { type: string, format: uuid }
        patientId: { type: string, format: uuid }
        dispensedBy: { type: string, format: uuid }
        totalAmount: { type: number }
        notes: { type: string }
        createdAt: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            required: [medicineId, batchId, quantity, unitPrice]
            properties:
              medicineId: { type: string, format: uuid }
              batchId: { type: string, format: uuid }
              quantity: { type: number }
              unitPrice: { type: number }
    StockCount:
      type: object
      required: [id, batchId, systemQuantity, countedQuantity, variance, createdAt]
      properties:
        id: { type: string, format: uuid }
        batchId: { type: string, format: uuid }
        systemQuantity: { type: number }
        countedQuantity: { type: number }
        variance: { type: number }
        createdAt: { type: string, format: date-time }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
