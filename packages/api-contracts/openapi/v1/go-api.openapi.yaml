openapi: 3.1.0
info:
  title: HIMS go-api
  version: 0.5.0
  description: Core service API for the Divine Hands HMS (identity, RBAC, sessions, audit).
servers:
  - url: http://localhost:8080
tags:
  - name: system
    description: Health, readiness, and metadata endpoints.
  - name: auth
    description: Authentication, sessions, and MFA.
  - name: patients
    description: Patient registration, master record, clinical, timeline, documents.
  - name: families
    description: Family profiles and membership.
  - name: orders
    description: Doctor orders, lifecycle, and medication administration.
  - name: clinical
    description: Notes, observations, tasks, reports, triage, and assignments.
  - name: pharmacy
    description: Medicines, inventory, dispensing, adjustments, and approvals.
  - name: assets
    description: General inventory, instruments, equipment, and maintenance.
  - name: lab
    description: Laboratory information system (clients, tests, specimens, results).
  - name: staff
    description: Staff profiles, leave, and workforce data.
  - name: attendance
    description: Shift definitions, clock-in/out, and attendance reporting.
  - name: handover
    description: Nursing shift handover notes and acknowledgement.
paths:
  /health:
    get:
      operationId: health
      summary: Liveness probe
      tags: [system]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      operationId: readiness
      summary: Readiness probe
      tags: [system]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
  /api/v1/version:
    get:
      operationId: version
      summary: Service metadata
      tags: [system]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Service metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Authenticate and create a session
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials or MFA required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/auth/me:
    get:
      operationId: me
      summary: Current user, roles, and permissions
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Session revoked
  /api/v1/auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      summary: Request a password reset
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
      responses:
        "202":
          description: Accepted (response is identical whether or not the account exists)
  /api/v1/auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Complete a password reset
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                newPassword:
                  type: string
      responses:
        "204":
          description: Password updated
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/auth/mfa/setup:
    post:
      operationId: mfaSetup
      summary: Generate a TOTP secret for enrollment
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: TOTP secret and provisioning URL
          content:
            application/json:
              schema:
                type: object
                required: [secret, otpauthUrl]
                properties:
                  secret:
                    type: string
                  otpauthUrl:
                    type: string
  /api/v1/auth/mfa/confirm:
    post:
      operationId: mfaConfirm
      summary: Verify a TOTP code and enable MFA
      tags: [auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        "204":
          description: MFA enabled
  /api/v1/patients:
    post:
      operationId: registerPatient
      summary: Register a patient
      tags: [patients]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPatientRequest"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "409":
          description: Duplicate patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/patients/search:
    get:
      operationId: searchPatients
      summary: Search patients by ID or permitted demographics
      tags: [patients]
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Matching patients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PatientSummary"
  /api/v1/patients/{id}:
    get:
      operationId: getPatient
      summary: Get a patient (clinical only with clinical.view)
      tags: [patients]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "404":
          description: Not found
    patch:
      operationId: updatePatient
      summary: Update patient demographics
      tags: [patients]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePatientRequest"
      responses:
        "204":
          description: Updated
  /api/v1/patients/{id}/amend:
    post:
      operationId: amendPatient
      summary: Correct a patient-level field (records an amendment)
      tags: [patients]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fieldName, newValue, reason]
              properties:
                fieldName:
                  type: string
                newValue:
                  type: string
                reason:
                  type: string
      responses:
        "204":
          description: Amended
  /api/v1/patients/{id}/clinical:
    get:
      operationId: listClinical
      summary: List a patient's clinical entries
      tags: [patients]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Clinical entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClinicalEntry"
    post:
      operationId: addClinical
      summary: Add a clinical entry
      tags: [patients]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [section, summary]
              properties:
                section:
                  type: string
                  enum:
                    [
                      allergy,
                      medical_history,
                      surgical_history,
                      chronic_condition,
                      medication,
                      family_history,
                      social_history,
                    ]
                summary:
                  type: string
                details:
                  type: object
                  additionalProperties: true
      responses:
        "201":
          description: Created
  /api/v1/patients/{id}/clinical/{entryId}:
    patch:
      operationId: amendClinical
      summary: Correct a clinical entry (records an amendment)
      tags: [patients]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: entryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                summary:
                  type: string
                details:
                  type: object
                  additionalProperties: true
                reason:
                  type: string
      responses:
        "204":
          description: Amended
  /api/v1/patients/{id}/timeline:
    get:
      operationId: listTimeline
      summary: List a patient's timeline
      tags: [patients]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Timeline events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimelineEvent"
  /api/v1/patients/{id}/documents:
    get:
      operationId: listDocuments
      summary: List a patient's documents
      tags: [patients]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
    post:
      operationId: addDocument
      summary: Record document metadata
      tags: [patients]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                documentType:
                  type: string
                title:
                  type: string
                fileName:
                  type: string
                contentType:
                  type: string
                fileSize:
                  type: integer
                  format: int64
      responses:
        "201":
          description: Created
  /api/v1/families:
    post:
      operationId: createFamily
      summary: Create a family profile
      tags: [families]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [familyName]
              properties:
                familyName:
                  type: string
                headPatientId:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"
  /api/v1/families/{id}:
    get:
      operationId: getFamily
      summary: Get a family profile with members
      tags: [families]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Family
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"
        "404":
          description: Not found
  /api/v1/patients/{id}/orders:
    post:
      operationId: createOrder
      summary: Create a doctor order
      tags: [orders]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderType]
              properties:
                orderType:
                  type: string
                  enum: [prescription, lab_request, nursing_order, referral]
                departmentId: { type: string, format: uuid }
                details:
                  type: object
                  additionalProperties: true
                noteId: { type: string, format: uuid }
                submit: { type: boolean }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
    get:
      operationId: listPatientOrders
      summary: List a patient's orders
      tags: [orders]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
  /api/v1/orders/actionable:
    get:
      operationId: listActionableOrders
      summary: List orders awaiting/under nursing action
      tags: [orders]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
  /api/v1/orders/{id}/submit:
    post:
      operationId: submitOrder
      summary: Submit a draft order
      tags: [orders]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204": { description: Submitted }
  /api/v1/orders/{id}/cancel:
    post:
      operationId: cancelOrder
      summary: Cancel a draft or submitted order
      tags: [orders]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        "204": { description: Cancelled }
  /api/v1/orders/{id}/status:
    post:
      operationId: transitionOrder
      summary: Advance an order to accepted/in_progress/completed
      tags: [orders]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [accepted, in_progress, completed] }
      responses:
        "204": { description: Transitioned }
  /api/v1/patients/{id}/administrations:
    post:
      operationId: addAdministration
      summary: Record a medication administration
      tags: [orders]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId]
              properties:
                orderId: { type: string, format: uuid }
                medication: { type: string }
                dose: { type: string }
                route: { type: string }
                notes: { type: string }
      responses:
        "201": { description: Recorded }
    get:
      operationId: listAdministrations
      summary: List medication administration records
      tags: [orders]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Administration" }
  /api/v1/patients/{id}/notes:
    post:
      operationId: createNote
      summary: Create a clinical note
      tags: [clinical]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                noteType: { type: string, enum: [consultation, nursing, progress] }
                departmentId: { type: string, format: uuid }
                note: { type: string }
                diagnosis: { type: string }
                treatmentPlan: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
    get:
      operationId: listNotes
      summary: List current notes
      tags: [clinical]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Notes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Note" }
  /api/v1/patients/{id}/notes/{groupId}:
    get:
      operationId: listNoteVersions
      summary: List all versions of a note
      tags: [clinical]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: groupId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Versions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Note" }
  /api/v1/patients/{id}/notes/{groupId}/versions:
    post:
      operationId: addNoteVersion
      summary: Append a new immutable note version
      tags: [clinical]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: groupId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                departmentId: { type: string, format: uuid }
                note: { type: string }
                diagnosis: { type: string }
                treatmentPlan: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
  /api/v1/patients/{id}/observations:
    post:
      operationId: addObservation
      summary: Record vitals/observations
      tags: [clinical]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category: { type: string, enum: [vitals, observation] }
                measurements:
                  type: object
                  additionalProperties: true
                notes: { type: string }
      responses:
        "201": { description: Recorded }
    get:
      operationId: listObservations
      summary: List observations
      tags: [clinical]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: category
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Observations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Observation" }
  /api/v1/tasks:
    post:
      operationId: createTask
      summary: Create a department task
      tags: [clinical]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                patientId: { type: string, format: uuid }
                departmentId: { type: string, format: uuid }
                title: { type: string }
                description: { type: string }
                assignedToUserId: { type: string, format: uuid }
      responses:
        "201": { description: Created }
    get:
      operationId: listTasks
      summary: List tasks
      tags: [clinical]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }
  /api/v1/tasks/{id}/complete:
    post:
      operationId: completeTask
      summary: Complete a task
      tags: [clinical]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204": { description: Completed }
  /api/v1/patients/{id}/admissions:
    post:
      operationId: admitPatient
      summary: Admit a patient
      tags: [clinical]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ward]
              properties:
                ward: { type: string }
                room: { type: string }
                bed: { type: string }
                attendingDoctorId: { type: string, format: uuid }
                admissionReason: { type: string }
      responses:
        "201":
          description: Admitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Admission" }
    get:
      operationId: listAdmissions
      summary: List a patient's admissions
      tags: [clinical]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Admissions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Admission" }
  /api/v1/patients/{id}/admissions/{admissionId}/discharge:
    post:
      operationId: dischargePatient
      summary: Discharge an active admission
      tags: [clinical]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: admissionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dischargeSummary]
              properties:
                dischargeSummary: { type: string }
                followUpInstructions: { type: string }
      responses:
        "200":
          description: Discharged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Admission" }
  /api/v1/patients/{id}/reports:
    post:
      operationId: createReport
      summary: Create a clinical report
      tags: [clinical]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content]
              properties:
                reportType: { type: string }
                title: { type: string }
                content: { type: string }
                departmentId: { type: string, format: uuid }
      responses:
        "201": { description: Created }
    get:
      operationId: listReports
      summary: List a patient's reports
      tags: [clinical]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Reports
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Report" }
  /api/v1/clinical/triage:
    post:
      operationId: triage
      summary: Register and triage an emergency patient
      tags: [clinical]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chiefComplaint, triageLevel]
              properties:
                firstName: { type: string }
                lastName: { type: string }
                gender: { type: string }
                chiefComplaint: { type: string }
                triageLevel: { type: string }
                measurements:
                  type: object
                  additionalProperties: true
      responses:
        "201":
          description: Triaged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TriageResponse" }
  /api/v1/clinical/queue:
    get:
      operationId: myQueue
      summary: The current clinician's assigned patients
      tags: [clinical]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Queue
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/QueueItem" }
  /api/v1/patients/{id}/assignments:
    post:
      operationId: assignPatient
      summary: Assign a patient to a clinician
      tags: [clinical]
      security:
        - bearerAuth: []
      parameters:
