# Builds downloadable artifacts for the hospital deployment:
#   - the Windows desktop installer (Tauri: NSIS + MSI)
#   - the main-PC server bundle (Go API + portable PostgreSQL + launcher)
#
# Trigger by pushing a tag (e.g. `v0.1.0`) or manually via "Run workflow".
# Signing is not configured yet — see the "Code signing (TODO)" notes below.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  desktop-windows:
    name: Desktop installer (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Code signing (TODO): when you have a Windows Authenticode certificate,
      # configure it in apps/desktop/src-tauri/tauri.conf.json (bundle.windows
      # certificateThumbprint / digestAlgorithm) and add its password as a
      # secret here. Unsigned installers still build and run, but SmartScreen
      # will warn end users.
      - name: Build the Windows installer
        working-directory: apps/desktop
        run: pnpm tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi

  server-bundle:
    name: Main-PC server bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      # Downloads portable PostgreSQL (~150-200 MB) and cross-compiles the Go
      # binaries. See infra/windows-bundle/build-bundle.sh and README.md.
      - name: Build the server bundle
        run: ./infra/windows-bundle/build-bundle.sh

      - name: Zip the bundle
        run: |
          cd dist
          zip -r hims-server-windows.zip windows-bundle

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: server-bundle
          if-no-files-found: error
          path: dist/hims-server-windows.zip

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [desktop-windows, server-bundle]
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts/windows-installer

      - name: Download server bundle
        uses: actions/download-artifact@v4
        with:
          name: server-bundle
          path: artifacts/server-bundle

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/windows-installer/*
            artifacts/server-bundle/*
