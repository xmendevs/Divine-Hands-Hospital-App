# Builds the downloadable desktop installers and publishes them as a GitHub
# Release:
#   - Windows: Electron NSIS .exe installer (client edition)
#   - Linux:   Electron AppImage + .deb installers (client + server editions;
#              the server edition bundles a portable PostgreSQL 16)
#
# Trigger by pushing a tag (e.g. `v0.1.0`) or manually via "Run workflow".
# The Tauri installer and main-PC server bundle are still buildable locally
# (`pnpm tauri build` / `./infra/windows-bundle/build-bundle.sh`) but are not
# part of the automated release - the Electron installers are the supported
# downloads. Signing is not configured yet - see the "Code signing (TODO)" note.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  electron-windows:
    name: Desktop installer (Electron)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Electron signing is not configured; the unsigned NSIS installer builds
      # and runs, but SmartScreen will warn end users. To sign later, add
      # win.signtoolOptions in apps/desktop/package.json and supply the
      # certificate as a workflow secret.
      - name: Build the Electron installer
        working-directory: apps/desktop
        run: pnpm dist

      - name: Upload Electron installer
        uses: actions/upload-artifact@v4
        with:
          name: electron-installer
          if-no-files-found: error
          path: apps/desktop/release/*.exe

  electron-linux:
    name: Desktop installer (Electron, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # dist:server:linux compiles the Go API/migrate/seed binaries, so the
      # runner needs the Go toolchain (same version as the CI workflow).
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Linux server edition bundles a portable PostgreSQL 16. On Ubuntu
      # 24.04 (this runner) the build host's /usr/lib/postgresql/16 binaries
      # and shared libraries are harvested into the payload, so PostgreSQL
      # must be installed on the runner before dist:server:linux runs.
      - name: Install PostgreSQL 16 (for the bundled server payload)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-client-16

      - name: Build the Linux client installer (AppImage + deb)
        working-directory: apps/desktop
        run: pnpm dist:linux

      - name: Build the Linux server edition installer (AppImage + deb)
        working-directory: apps/desktop
        run: pnpm dist:server:linux

      - name: Upload Linux installers
        uses: actions/upload-artifact@v4
        with:
          name: electron-installer-linux
          if-no-files-found: error
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release-server/*.AppImage
            apps/desktop/release-server/*.deb

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [electron-windows, electron-linux]
    permissions:
      contents: write
    steps:
      - name: Download Electron installer
        uses: actions/download-artifact@v4
        with:
          name: electron-installer
          path: artifacts/electron-installer

      - name: Download Linux installers
        uses: actions/download-artifact@v4
        with:
          name: electron-installer-linux
          path: artifacts/electron-installer-linux

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/electron-installer/*
            artifacts/electron-installer-linux/*
