# Builds the downloadable Windows desktop installer (Electron: NSIS .exe) and
# publishes it as a GitHub Release.
#
# Trigger by pushing a tag (e.g. `v0.1.0`) or manually via "Run workflow".
# The Tauri installer and main-PC server bundle are still buildable locally
# (`pnpm tauri build` / `./infra/windows-bundle/build-bundle.sh`) but are not
# part of the automated release - the Electron installer is the supported
# download. Signing is not configured yet - see the "Code signing (TODO)" note.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  electron-windows:
    name: Desktop installer (Electron)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Electron signing is not configured; the unsigned NSIS installer builds
      # and runs, but SmartScreen will warn end users. To sign later, add
      # win.signtoolOptions in apps/desktop/package.json and supply the
      # certificate as a workflow secret.
      - name: Build the Electron installer
        working-directory: apps/desktop
        run: pnpm dist

      - name: Upload Electron installer
        uses: actions/upload-artifact@v4
        with:
          name: electron-installer
          if-no-files-found: error
          path: apps/desktop/release/*.exe

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [electron-windows]
    permissions:
      contents: write
    steps:
      - name: Download Electron installer
        uses: actions/download-artifact@v4
        with:
          name: electron-installer
          path: artifacts/electron-installer

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/electron-installer/*
