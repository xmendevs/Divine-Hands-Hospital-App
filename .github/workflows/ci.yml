name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Desktop & UI (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  go-api:
    name: Core service (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hims
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: hims_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hims"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/go-api
    env:
      TEST_DATABASE_URL: postgres://hims:change-me@127.0.0.1:5432/hims_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "Files needing gofmt:"; echo "$files"; exit 1
          fi
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: Integration tests
        run: go test -tags integration ./...

  fastapi:
    name: Analytics service (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/fastapi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest -q
